services:
  - type: web
    name: gridbricks-backend
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install --upgrade pip && pip install -e .
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.9"
      - key: DATA_DIR
        value: data
      - key: FRONTEND_URL
        sync: false
