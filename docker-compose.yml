services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: gridbricks-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DATA_DIR=/app/data
      - PYTHONUNBUFFERED=1
    volumes:
      # Mount committed data snapshot as read-only volume for consistency and live updates
      - ./backend/data:/app/data:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request, sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health').getcode() == 200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - gridbricks-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: gridbricks-frontend
    restart: unless-stopped
    ports:
      - "3000:8080"
      - "5173:8080"
    environment:
      # Frontend routes API traffic to backend container via Docker bridge network DNS
      - BACKEND_URL=http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - gridbricks-network

networks:
  gridbricks-network:
    name: gridbricks-network
    driver: bridge
